[tool.pytest.ini_options]
markers = [
    "browser: drives the app in Chromium with Playwright (tests/browser)",
]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["claude-memory-hylki"]

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, bugbear, pyupgrade, simplify, mccabe
select = ["F", "E", "W", "I", "B", "UP", "SIM", "C90"]
# SIM300 takes an UPPER_CASE attribute (Config.SECRET_KEY) for a constant and
# calls the comparison a Yoda condition.
ignore = ["SIM300"]

[tool.ruff.lint.pycodestyle]
# The formatter writes to line-length; this leaves room for what it can't
# split, and for a longer name when tools/init-project.sh renames the package.
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
# SVG path data reads better as one line per icon.
"hyprapp/icons.py" = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.hyprapp.checks]
# What tools/check-code.py enforces, on every commit (tools/git-hooks/pre-commit),
# in CI, and after each edit Claude Code makes. Raising a budget or adding an
# exception is an edit here, in the open; never a skip in the code.
paths = ["hyprapp", "tests", "tools", "run.py"]
max_function_lines = 50
max_complexity = 10
# A block this many normalized lines long, found twice, is duplication. CSS
# counts declarations, one per line.
duplicate_lines = 6

[tool.hyprapp.checks.max_lines]
py = 300
js = 300
css = 300
html = 200

[tool.hyprapp.checks.exceptions]
# "path" (over its line budget), "path:function" (over a function budget) or
# "path:duplicates" (left out of the duplicate search) = "why".

[tool.coverage.run]
source = ["hyprapp"]
# Measure the Python processes the tests start too: the worker's thread is
# tested in a fresh interpreter, since it starts once per process.
patch = ["subprocess"]

[tool.coverage.report]
# The floor only goes up: when coverage rises, raise this to the new figure,
# rounded down. Never lower it to let a change in; test the change instead.
fail_under = 99
show_missing = true
skip_covered = true
