{% extends "auth/form.html" %}
{% block title %}Sign in — {{ app_name }}{% endblock %}
{% block fields %}
      <label class="field">
        <span class="field-label">Email</span>
        {# type=text on purpose: accounts made before the email rule still sign in #}
        <input name="username" required autofocus autocomplete="username" spellcheck="false"
               inputmode="email" placeholder="you@example.com" value="{{ request.form.get('username', '') }}">
      </label>
      <label class="field">
        <span class="field-label">Password</span>
        <input name="password" type="password" required autocomplete="current-password">
      </label>
      <label class="check">
        <input type="checkbox" name="remember" checked>
        <span>Keep me signed in</span>
      </label>
{% endblock %}
{% block submit %}Sign in{% endblock %}
{% block alt %}
    {% if allow_registration %}
      <p class="auth-alt">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
    {% endif %}
{% endblock %}
