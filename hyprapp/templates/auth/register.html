{% extends "auth/form.html" %}
{% block title %}Create account — {{ app_name }}{% endblock %}
{% block fields %}
      <label class="field">
        <span class="field-label">Name</span>
        <input name="name" type="text" autocomplete="name" maxlength="120" placeholder="Your name"
               value="{{ request.form.get('name', '') }}">
      </label>
      <label class="field">
        <span class="field-label">Email</span>
        <input name="username" type="email" required autocomplete="email"
               spellcheck="false" maxlength="80" placeholder="you@example.com"
               value="{{ request.form.get('username', '') }}">
      </label>
      <label class="field">
        <span class="field-label">Password</span>
        <input name="password" type="password" required minlength="8" autocomplete="new-password">
      </label>
      <label class="field">
        <span class="field-label">Confirm password</span>
        <input name="confirm" type="password" required minlength="8" autocomplete="new-password">
      </label>
{% endblock %}
{% block submit %}Create account{% endblock %}
{% block alt %}
    <p class="auth-alt">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
{% endblock %}
