name: CI

# Each job runs one stage of tools/check.sh, so CI and a local run check the
# same things the same way.
on:
  push:
    branches: [main, beta, "stable-*"]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff, code shape, documentation, commit messages
        run: tools/check.sh static
        env:
          # A pull request's commits, or the commits a push brought: the hook
          # can be skipped with --no-verify, this can't.
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  tests:
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests, with the coverage floor
        run: tools/check.sh tests

  browser:
    needs: static
    runs-on: ubuntu-latest
    # The browser and fonts the visual baselines were checked against.
    container: mcr.microsoft.com/playwright/python:v1.61.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: pip install --break-system-packages -r requirements-dev.txt
      - name: Browser suite, with the visual comparison
        run: tools/check.sh browser
      - name: Upload the screenshots that differ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: tests/browser/visual-diffs/
          if-no-files-found: ignore

  image:
    needs: [tests, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image builds
        run: tools/check.sh image
